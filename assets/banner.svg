<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#05d9e8" opacity=".06"/></pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#3c096c"/></pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .t{font-family:"Cascadia Code",Consolas,"Courier New",monospace;font-weight:700}
    .m{font-family:"Cascadia Code",Consolas,"Courier New",monospace}
    .gm{transform:translate(-3px,0);animation:gm 3.2s steps(1) infinite}
    .gc{transform:translate(3px,0);animation:gc 3.2s steps(1) infinite}
    @keyframes gm{0%,88%,100%{transform:translate(-3px,0)}90%{transform:translate(-9px,2px)}93%{transform:translate(5px,-2px)}}
    @keyframes gc{0%,88%,100%{transform:translate(3px,0)}90%{transform:translate(9px,-2px)}93%{transform:translate(-5px,2px)}}
    .cur{animation:b 1s steps(1) infinite}
    @keyframes b{50%{opacity:0}}
  </style>
  <rect width="900" height="240" fill="#07060d"/>
  <rect width="900" height="240" fill="url(#dots)"/>
  <g fill="none" stroke="#05d9e8" stroke-width="2" filter="url(#glow)">
    <path d="M14 44V14h30M856 14h30v30M886 196v30h-30M44 226H14v-30"/>
  </g>
  <g stroke="#ff2a6d" stroke-width="1" opacity=".55" fill="none">
    <path d="M60 62h120l14-14h90"/><path d="M840 178H720l-14 14h-90"/>
  </g>
  <g fill="#ff2a6d" opacity=".8"><circle cx="284" cy="48" r="3"/><circle cx="616" cy="192" r="3"/></g>
  <text class="m" x="60" y="40" font-size="11" fill="#ff2a6d" letter-spacing="2">ANALISTA DE SISTEMAS PLENO</text>
  <text class="m" x="840" y="40" font-size="11" fill="#05d9e8" letter-spacing="2" text-anchor="end">LOC: PARANAGUÁ_PR</text>
  <text class="m" x="60" y="210" font-size="11" fill="#05d9e8" letter-spacing="2">PYTHON · TYPESCRIPT · UIPATH</text>
  <text class="m" x="840" y="210" font-size="11" fill="#ff2a6d" letter-spacing="2" text-anchor="end">RPA · LLM · AGENTES</text>
  <g text-anchor="middle">
    <text class="t gm" x="450" y="128" font-size="64" fill="#ff2a6d" opacity=".85" letter-spacing="4">YURI RAMOS</text>
    <text class="t gc" x="450" y="128" font-size="64" fill="#05d9e8" opacity=".85" letter-spacing="4">YURI RAMOS</text>
    <text class="t" x="450" y="128" font-size="64" fill="#f2f2ff" letter-spacing="4">YURI RAMOS</text>
  </g>
  <text class="m" x="450" y="162" font-size="15" fill="#05d9e8" text-anchor="middle" filter="url(#glow)">&gt; ia aplicada ao desenvolvimento de software<tspan class="cur">_</tspan></text>
  <rect width="900" height="240" fill="url(#scan)"/>
</svg>
